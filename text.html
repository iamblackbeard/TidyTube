<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>TidyTube Extension UI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        yt: {
                            bg: '#0F0F0F',
                            surface: '#171717',
                            surfaceHover: '#1F1F1F',
                            border: '#262626',
                            borderSubtle: '#1F1F1F',
                            red: '#FF0033',
                            textPrimary: '#F1F1F1',
                            textSecondary: '#A3A3A3',
                            textMuted: '#666666',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Minimal sleek scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #2A2A2A;
            border-radius: 9999px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #3D3D3D;
        }

        /* Snappy smooth transitions */
        .checkbox-box {
            transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body
    class="bg-[#0A0A0C] text-[#E0E0E0] min-h-screen font-sans antialiased flex flex-col justify-between py-10 px-4 select-none">
    <!-- Top Showcase Navigation -->

    <!-- Centered Clean Presentation -->
    <main class="w-full flex-1 flex flex-col items-center justify-center">
        <!-- BROWSER EXTENSION FRAME (Standard 350px width, sleek minimalist dark shell) -->
        <div
            class="w-[350px] bg-[#0F0F0F] rounded-2xl border border-[#232323] shadow-[0_24px_64px_-16px_rgba(0,0,0,0.85),0_0_0_1px_rgba(255,255,255,0.04)] overflow-hidden flex flex-col transition-all">
            <!-- 1. HEADER ZONE -->
            <div class="px-4 py-3 bg-[#141414] border-b border-[#202020] flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div
                        class="w-5 h-5 rounded-md bg-[#FF0033] flex items-center justify-center text-white shadow-sm shadow-red-950/50">
                        <svg class="w-3 h-3 fill-current" viewbox="0 0 24 24">
                            <path
                                d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z">
                            </path>
                        </svg>
                    </div>
                    <span class="text-[13px] font-semibold tracking-tight text-[#F1F1F1]">TidyTube</span>
                </div>
                <!-- Clean Status Indicator & Options -->
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-950/40 text-emerald-400 text-[10px] font-medium"
                        title="Active on youtube.com">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span>Active</span>
                    </div>
                    <button class="text-zinc-500 hover:text-zinc-200 p-1 rounded-md hover:bg-zinc-800 transition-colors"
                        title="Extension Settings">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- 2. SCROLLABLE BODY (Breathable list with subtle line dividers) -->
            <div class="overflow-y-auto max-h-[480px] custom-scroll p-3.5 space-y-4 bg-[#0F0F0F]">
                <!-- SECTION: HOMEPAGE -->
                <section class="space-y-1">
                    <h2 class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400 px-2 py-0.5">Homepage
                    </h2>
                    <div class="space-y-0.5">
                        <!-- Row 1 -->
                        <label
                            class="group flex items-start gap-3 p-2 rounded-lg hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideHomeRecommendations">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="hideHomeRecommendations" type="checkbox" />
                                <div
                                    class="checkbox-box w-4 h-4 rounded-[4px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Hide home recommendation feed</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Replaces endless homepage grid with a calm
                                    space</div>
                            </div>
                        </label>
                        <!-- Row 2 -->
                        <label
                            class="group flex items-start gap-3 p-2 rounded-lg hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideHomeShorts">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="hideHomeShorts" type="checkbox" />
                                <div
                                    class="checkbox-box w-4 h-4 rounded-[4px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Hide Shorts shelves</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Removes Shorts carousels and reels from
                                    home</div>
                            </div>
                        </label>
                    </div>
                </section>
                <div class="h-px bg-zinc-800/60 mx-1"></div>
                <!-- SECTION: SEARCH RESULTS -->
                <section class="space-y-1">
                    <h2 class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400 px-2 py-0.5">Search
                        Results</h2>
                    <div class="space-y-0.5">
                        <!-- Row -->
                        <label
                            class="group flex items-start gap-3 p-2 rounded-lg hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideSearchShorts">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="hideSearchShorts" type="checkbox" />
                                <div
                                    class="checkbox-box w-4 h-4 rounded-[4px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Hide Shorts in search results</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Focus purely on relevant long-form video
                                    results</div>
                            </div>
                        </label>
                    </div>
                </section>
                <div class="h-px bg-zinc-800/60 mx-1"></div>
                <!-- SECTION: WATCH PAGE (Clean Parent/Child Hierarchy) -->
                <section class="space-y-1.5">
                    <div class="flex items-center justify-between px-2 py-0.5">
                        <h2 class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Watch Page</h2>
                        <span class="text-[10px] font-mono text-zinc-400" id="watchCountBadge">4 of 4 active</span>
                    </div>
                    <!-- Master Checkbox Row -->
                    <div class="bg-[#151515] rounded-lg border border-zinc-800/80 p-2">
                        <label class="group flex items-start gap-3 cursor-pointer" for="hideWatchDistractions">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="hideWatchDistractions" type="checkbox" />
                                <div class="checkbox-box w-4 h-4 rounded-[4px] border border-[#FF0033] bg-[#FF0033] flex items-center justify-center text-white"
                                    id="masterCheckboxBox">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none transition-opacity"
                                        id="masterCheckIcon" viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                    <svg class="w-3 h-3 stroke-white stroke-[3] fill-none hidden" id="masterDashIcon"
                                        viewbox="0 0 24 24">
                                        <line x1="5" x2="19" y1="12" y2="12"></line>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-semibold text-white leading-tight">Hide all watch
                                    distractions</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Master toggle for sidebar, comments &amp;
                                    overlays</div>
                            </div>
                        </label>
                    </div>
                    <!-- Sub-items with clean hairline tree guide -->
                    <div class="ml-3 pl-3 border-l border-zinc-800 space-y-0.5">
                        <!-- Sub 1 -->
                        <label
                            class="group flex items-start gap-2.5 p-1.5 rounded-md hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideWatchRecommendations">
                            <div class="pt-0.5 relative">
                                <input checked="" class="watch-sub-checkbox peer sr-only" id="hideWatchRecommendations"
                                    type="checkbox" />
                                <div
                                    class="checkbox-box w-3.5 h-3.5 rounded-[3px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-2.5 h-2.5 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div
                                    class="text-[12.5px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Sidebar recommendations</div>
                            </div>
                        </label>
                        <!-- Sub 2 -->
                        <label
                            class="group flex items-start gap-2.5 p-1.5 rounded-md hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideWatchComments">
                            <div class="pt-0.5 relative">
                                <input checked="" class="watch-sub-checkbox peer sr-only" id="hideWatchComments"
                                    type="checkbox" />
                                <div
                                    class="checkbox-box w-3.5 h-3.5 rounded-[3px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-2.5 h-2.5 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div
                                    class="text-[12.5px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Comments &amp; live chat</div>
                            </div>
                        </label>
                        <!-- Sub 3 -->
                        <label
                            class="group flex items-start gap-2.5 p-1.5 rounded-md hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideWatchEndScreen">
                            <div class="pt-0.5 relative">
                                <input checked="" class="watch-sub-checkbox peer sr-only" id="hideWatchEndScreen"
                                    type="checkbox" />
                                <div
                                    class="checkbox-box w-3.5 h-3.5 rounded-[3px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-2.5 h-2.5 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div
                                    class="text-[12.5px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    End-screen video cards</div>
                            </div>
                        </label>
                        <!-- Sub 4 -->
                        <label
                            class="group flex items-start gap-2.5 p-1.5 rounded-md hover:bg-[#161616] cursor-pointer transition-colors"
                            for="hideWatchInfoCards">
                            <div class="pt-0.5 relative">
                                <input checked="" class="watch-sub-checkbox peer sr-only" id="hideWatchInfoCards"
                                    type="checkbox" />
                                <div
                                    class="checkbox-box w-3.5 h-3.5 rounded-[3px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-2.5 h-2.5 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div
                                    class="text-[12.5px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Video info teaser cards</div>
                            </div>
                        </label>
                    </div>
                </section>
                <div class="h-px bg-zinc-800/60 mx-1"></div>
                <!-- SECTION: PLAYBACK & UTILITIES -->
                <section class="space-y-1">
                    <h2 class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400 px-2 py-0.5">Player
                        &amp; Utilities</h2>
                    <div class="space-y-0.5">
                        <!-- Row: Shorts Redirect -->
                        <label
                            class="group flex items-start gap-3 p-2 rounded-lg hover:bg-[#161616] cursor-pointer transition-colors"
                            for="redirectShorts">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="redirectShorts" type="checkbox" />
                                <div
                                    class="checkbox-box w-4 h-4 rounded-[4px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Redirect Shorts to standard player</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Opens <span
                                        class="font-mono text-zinc-300">/shorts/</span> as standard video</div>
                            </div>
                        </label>
                        <!-- Row: Playlist Duration -->
                        <label
                            class="group flex items-start gap-3 p-2 rounded-lg hover:bg-[#161616] cursor-pointer transition-colors"
                            for="showPlaylistDuration">
                            <div class="pt-0.5 relative">
                                <input checked="" class="peer sr-only" id="showPlaylistDuration" type="checkbox" />
                                <div
                                    class="checkbox-box w-4 h-4 rounded-[4px] border border-zinc-700 bg-[#141414] peer-checked:bg-[#FF0033] peer-checked:border-[#FF0033] flex items-center justify-center text-white">
                                    <svg class="w-3 h-3 stroke-white stroke-[2.5] fill-none opacity-0 peer-checked:opacity-100 transition-opacity"
                                        viewbox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-medium text-zinc-200 group-hover:text-white leading-tight">
                                    Show playlist total duration</div>
                                <div class="text-[11px] text-zinc-400 mt-0.5">Calculates total study/course runtime
                                </div>
                            </div>
                        </label>
                    </div>
                </section>
            </div>
            <!-- 3. FOOTER ZONE -->
            <div
                class="px-4 py-2.5 bg-[#141414] border-t border-[#202020] flex items-center justify-between text-zinc-500">
                <div class="flex items-center gap-1.5 text-[11px]">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="transition-colors" id="syncText">Synced with YouTube</span>
                </div>
                <span class="text-[10px] font-mono text-zinc-400">Esc to close</span>
            </div>
        </div>

    </main>


</body>

</html>
